uvmf:
  environments:
    control:
      agents:
      - name: "control_in_agnt"
        type: "control_in"
      - name: "control_out_agnt"
        type: "control_out"
      imports:
      - name: "lc3_prediction_pkg"
      analysis_components:
      - name: "control_pred"
        type: "control_predictor"
      scoreboards:
      - name: "control_scbd"
        sb_type: "uvmf_in_order_scoreboard"
        trans_type: "control_out_transaction"
      tlm_connections:
      - driver: "control_in_agnt.monitored_ap"
        receiver: "control_pred.control_pred_ae"
        validate: "True"
      - driver: "control_out_agnt.monitored_ap"
        receiver: "control_scbd.actual_analysis_export"
        validate: "True"
      - driver: "control_pred.control_pred_ap"
        receiver: "control_scbd.expected_analysis_export"
        validate: "True"

