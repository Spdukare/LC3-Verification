uvmf:
  interfaces:
    "dmem":
      clock: "clock"
      reset: "reset"
      reset_assertion_level: "True"
      
      ports: 
        - name: "data_dout"   
          width: "16"        
          dir: "input"
        - name: "complete_data"   
          width: "1"        
          dir: "input" 
        - name: "data_din"   
          width: "16"        
          dir: "output" 
        - name: "data_rd"   
          width: "1"        
          dir: "output"
        - name: "data_addr"
          width: "16"
          dir: "output"
        
      transaction_vars: 
        - name: "data_dout"  
          type: "bit [15:0]"
          isrand: "True"
          iscompare: "True" 
        - name: "complete_data"  
          type: "bit"
          isrand: "True"
          iscompare: "True" 
        - name: "data_din"
          type: "bit [15:0]"
          isrand: "False"
          iscompare: "True"
        - name: "data_rd"  
          type: "bit"
          isrand: "False"
          iscompare: "True" 
        - name: "data_addr"  
          type: "bit [15:0]"
          isrand: "False"
          iscompare: "True"
