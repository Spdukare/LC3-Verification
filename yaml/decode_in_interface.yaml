uvmf:
  interfaces:
    decode_in:
      clock: clock
      reset: reset
      reset_assertion_level: 'True'
      veloce_ready: 'False'
      ports:
      - name: enable_decode
        width: '1'
        dir: output
        reset_value: '''bz'
      - name: instr_dout
        width: '16'
        dir: output
        reset_value: '''bz'
      - name: npc_in
        width: '16'
        dir: output
        reset_value: '''bz'
      transaction_vars:
      - name: "instr_dout"
        type: "bit [15:0]"
      - name: "npc_in"
        type: "bit [15:0]"