uvmf:
  environments:
    "lc3":
      agents:
      - name: "imem_agnt"
        type: "imem"
        initiator_responder: "RESPONDER"
      - name: "dmem_agnt"
        type: "dmem"
        initiator_responder: "RESPONDER"
      imports:
      - name: fetch_in_pkg
      - name: fetch_out_pkg
      - name: decode_in_pkg
      - name: decode_out_pkg
      - name: execute_in_pkg
      - name: execute_out_pkg
      - name: memaccess_in_pkg
      - name: memaccess_out_pkg
      - name: writeback_in_pkg
      - name: writeback_out_pkg
      - name: control_in_pkg
      - name: control_out_pkg
      - name: imem_pkg
      - name: dmem_pkg
      - name: fetch_env_pkg
      - name: decode_env_pkg
      - name: execute_env_pkg
      - name: memaccess_env_pkg
      - name: writeback_env_pkg
      - name: control_env_pkg
      subenvs:
      - name: fetch
        type: fetch
      - name: decode
        type: decode
      - name: execute
        type: execute
      - name: memaccess
        type: memaccess
      - name: writeback
        type: writeback
      - name: control
        type: control

      