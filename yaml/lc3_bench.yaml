uvmf:
  benches:
    lc3:
      top_env: lc3
      veloce_ready: "False"
      clock_half_period: 5ns
      clock_phase_offset: 10ns
      reset_assertion_level: "True"
      reset_duration: 200ns
      active_passive:
      - bfm_name: imem_agnt
        value: ACTIVE
      - bfm_name: dmem_agnt
        value: ACTIVE
      - bfm_name: fetch_fetch_in_agnt
        value: PASSIVE
      - bfm_name: fetch_fetch_out_agnt
        value: PASSIVE
      - bfm_name: decode_decode_in_agnt
        value: PASSIVE
      - bfm_name: decode_decode_out_agnt
        value: PASSIVE
      - bfm_name: execute_execute_in_agnt
        value: PASSIVE
      - bfm_name: execute_execute_out_agnt
        value: PASSIVE
      - bfm_name: memaccess_memaccess_in_agnt
        value: PASSIVE
      - bfm_name: memaccess_memaccess_out_agnt
        value: PASSIVE
      - bfm_name: writeback_writeback_in_agnt
        value: PASSIVE
      - bfm_name: writeback_writeback_out_agnt
        value: PASSIVE
      - bfm_name: control_control_in_agnt
        value: PASSIVE
      - bfm_name: control_control_out_agnt
        value: PASSIVE
      imports:
      - name: lc3_env_pkg
      - name: imem_pkg
      - name: dmem_pkg
      - name: fetch_env_pkg
      - name: decode_env_pkg
      - name: execute_env_pkg
      - name: memaccess_env_pkg
      - name: writeback_env_pkg
      - name: lc3_prediction_pkg